# Builds the Windows .exe, the zip and the setup wizard on GitHub's own Windows PC (free
# for public repos). Runs when:
#  - you push to main and VERSION in app.py is new: it publishes the release vX.Y.Z by itself
#  - you push a version tag (e.g. v7.0.0), or click "Run workflow"
name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which version is this?
        id: ver
        shell: bash
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' app.py)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$v" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
          echo "Version $v"

      - name: Stop here if this version was already released
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.new != 'true'
        shell: bash
        run: echo "v${{ steps.ver.outputs.version }} is already released; nothing to build." && exit 0

      - uses: actions/setup-python@v5
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.new == 'true'
        with:
          python-version: "3.12"

      - name: Install what the app needs
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.new == 'true'
        run: python -m pip install --upgrade -r requirements.txt

      - name: Draw the icons
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.new == 'true'
        run: python tools/make_icon.py

      - name: Build the single .exe
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.new == 'true'
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name DiscordMessageCleaner --distpath dist_single --workpath build_single
          --icon icon.ico --version-file version_info.txt
          --add-data "icon.ico;." --add-data "icon.png;." --add-data "icon_16.png;."
          --add-data "icon_32.png;." --add-data "icon_48.png;." --add-data "icon_64.png;."
          --add-data "icon_256.png;."
          --hidden-import app --hidden-import tray --hidden-import media
          --hidden-import richtext --hidden-import social --hidden-import everyday --hidden-import archive --hidden-import planner --hidden-import safety --hidden-import emojis --hidden-import pystray._win32
          --hidden-import i18n_keys --hidden-import lang_es --hidden-import lang_pt --hidden-import lang_de
          main.py

      - name: Build the folder version (for the setup wizard)
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.new == 'true'
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name DiscordMessageCleaner
          --icon icon.ico --version-file version_info.txt
          --add-data "icon.ico;." --add-data "icon.png;." --add-data "icon_16.png;."
          --add-data "icon_32.png;." --add-data "icon_48.png;." --add-data "icon_64.png;."
          --add-data "icon_256.png;."
          --hidden-import app --hidden-import tray --hidden-import media
          --hidden-import richtext --hidden-import social --hidden-import everyday --hidden-import archive --hidden-import planner --hidden-import safety --hidden-import emojis --hidden-import pystray._win32
          --hidden-import i18n_keys --hidden-import lang_es --hidden-import lang_pt --hidden-import lang_de
          main.py

      - name: Build the setup wizard (Inno Setup)
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.new == 'true'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Zip the .exe
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.new == 'true'
        shell: pwsh
        run: |
          $v = (Select-String -Path app.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          Compress-Archive -Force -Path dist_single\DiscordMessageCleaner.exe, README.md, LICENSE `
            -DestinationPath "DiscordMessageCleaner_v${v}_windows.zip"

      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main' || steps.ver.outputs.new == 'true'
        with:
          name: DiscordMessageCleaner-windows
          path: |
            DiscordMessageCleaner_v*_windows.zip
            installer_output/*.exe

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Discord Message Cleaner ${{ steps.ver.outputs.version }}
          files: |
            DiscordMessageCleaner_v*_windows.zip
            installer_output/*.exe
          generate_release_notes: true
