# Builds the Windows .exe, the zip and the setup wizard on GitHub's own Windows PC (free
# for public repos). Runs when you push a version tag (e.g. v7.0.0) or click "Run workflow".
# With a tag, the files are attached to a GitHub Release automatically.
name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what the app needs
        run: python -m pip install --upgrade -r requirements.txt

      - name: Draw the icons
        run: python tools/make_icon.py

      - name: Build the single .exe
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name DiscordMessageCleaner --distpath dist_single --workpath build_single
          --icon icon.ico --version-file version_info.txt
          --add-data "icon.ico;." --add-data "icon.png;." --add-data "icon_16.png;."
          --add-data "icon_32.png;." --add-data "icon_48.png;." --add-data "icon_64.png;."
          --add-data "icon_256.png;."
          --hidden-import app --hidden-import tray --hidden-import media
          --hidden-import richtext --hidden-import emojis --hidden-import pystray._win32
          --hidden-import i18n_keys --hidden-import lang_es --hidden-import lang_pt --hidden-import lang_de
          main.py

      - name: Build the folder version (for the setup wizard)
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name DiscordMessageCleaner
          --icon icon.ico --version-file version_info.txt
          --add-data "icon.ico;." --add-data "icon.png;." --add-data "icon_16.png;."
          --add-data "icon_32.png;." --add-data "icon_48.png;." --add-data "icon_64.png;."
          --add-data "icon_256.png;."
          --hidden-import app --hidden-import tray --hidden-import media
          --hidden-import richtext --hidden-import emojis --hidden-import pystray._win32
          --hidden-import i18n_keys --hidden-import lang_es --hidden-import lang_pt --hidden-import lang_de
          main.py

      - name: Build the setup wizard (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Zip the .exe
        shell: pwsh
        run: |
          $v = (Select-String -Path app.py -Pattern 'VERSION = "(.+)"').Matches[0].Groups[1].Value
          Compress-Archive -Force -Path dist_single\DiscordMessageCleaner.exe, README.md, LICENSE `
            -DestinationPath "DiscordMessageCleaner_v${v}_windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: DiscordMessageCleaner-windows
          path: |
            DiscordMessageCleaner_v*_windows.zip
            installer_output/*.exe

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DiscordMessageCleaner_v*_windows.zip
            installer_output/*.exe
          generate_release_notes: true
